name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Generate initial Drizzle migration
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonder
        run: bun run db:generate

      - name: Upload generated bootstrap files
        uses: actions/upload-artifact@v4
        with:
          name: sonder-bootstrap-files
          path: |
            bun.lock
            apps/api/drizzle/

      - name: Commit generated lockfile and initial migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock apps/api/drizzle
          if git diff --cached --quiet; then
            echo "No generated bootstrap files to commit"
            exit 0
          fi
          git commit -m "chore: add Bun lockfile and initial Drizzle migration"
          git push origin "HEAD:${HEAD_REF}"

      - name: Typecheck all workspaces
        run: bun run typecheck:all

      - name: Run shared contract tests
        run: bun run test

      - name: Build web application
        run: bun run build

      - name: Build Cloudflare Worker
        run: bun run build:cloudflare

      - name: Typecheck API workspace
        working-directory: apps/api
        run: bun run typecheck
