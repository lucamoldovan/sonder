name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Generate initial Drizzle migration
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonder
        run: bun run db:generate

      - name: Upload generated bootstrap files
        uses: actions/upload-artifact@v4
        with:
          name: sonder-bootstrap-files
          path: |
            bun.lock
            apps/api/drizzle/

      - name: Typecheck all workspaces
        run: bun run typecheck:all

      - name: Run shared contract tests
        run: bun run test

      - name: Build web application
        run: bun run build

      - name: Build Cloudflare Worker
        run: bun run build:cloudflare

      - name: Typecheck API workspace
        run: bun --cwd apps/api run typecheck
