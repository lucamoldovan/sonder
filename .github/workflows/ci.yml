name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed Drizzle migrations
        run: |
          test -f apps/api/drizzle/meta/_journal.json
          test -f apps/api/drizzle/meta/0000_snapshot.json
          test -n "$(find apps/api/drizzle -maxdepth 1 -name '*.sql' -print -quit)"

      - name: Typecheck all workspaces
        run: bun run typecheck:all

      - name: Run shared contract tests
        run: bun run test

      - name: Build web application
        run: bun run build

      - name: Build Cloudflare Worker
        run: bun run build:cloudflare

      - name: Dry-run Cloudflare deployment
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
          BETTER_AUTH_SECRET: ci-only-placeholder-secret-do-not-use
          BETTER_AUTH_URL: https://sonder.example.workers.dev
          WEB_APP_URL: https://sonder.example.workers.dev
          ENVIRONMENT: production
        run: bunx opennextjs-cloudflare deploy -- --dry-run --keep-vars

      - name: Typecheck API workspace
        working-directory: apps/api
        run: bun run typecheck
